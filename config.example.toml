# Конфигурация парсера Avito для отслеживания объявлений «калоприемники».
#
# Скопируйте этот файл в config.toml и заполните секреты (токены, прокси):
#   cp config.example.toml config.toml
#
# config.toml в .gitignore — не коммитьте его (внутри токены/прокси).
# Все параметры описаны в README.md.

[avito]

# --- Поисковые ссылки ----------------------------------------------------
# s=104 — сортировка «по дате: сначала новые», поэтому свежие объявления сверху.
urls = [
    "https://www.avito.ru/all?q=калоприемники&s=104",
]

# Сколько страниц парсить по каждой ссылке. 1 = только первая (самые новые).
count = 1

# --- Уведомления: VK (основной канал) ------------------------------------
# Как получить ключ сообщества и свой user_id — см. README.md.
vk_token = ""
vk_user_id = []          # пример: ["1234567"]  (только цифры, не username)

# --- Уведомления: Telegram (опционально, можно оставить пустым) ----------
tg_token = ""
tg_chat_id = []          # пример: ["123456789"]
tg_only_text = false     # true — слать только текст без фото (быстрее)

# --- Фильтры -------------------------------------------------------------
# Белый список: объявление пройдёт, только если содержит хотя бы одно слово.
keys_word_white_list = ["калоприемник", "калоприёмник", "калоприемники", "калоприёмники"]

# Чёрный список: объявление отбрасывается, если содержит любое из слов.
# Помогает частично отсекать перекупов/магазины и нерелевантное.
keys_word_black_list = ["куплю", "опт", "оптом", "магазин"]

# Чёрный список продавцов по их sellerId (узнаётся из объявления).
seller_black_list = []

# Диапазон цены (руб.). 0 / большое число = без ограничения.
min_price = 0
max_price = 999999999

# Гео-фильтр по адресу. Пусто = вся Россия.
geo = ""

# Максимальный возраст объявления в секундах для отправки уведомления.
# 0 = без фильтра по времени (полагаемся на дедупликацию по базе).
# Совет: при первом запуске оставьте 0, чтобы база пометила старые как
# просмотренные; потом будут приходить только реально новые.
max_age = 0

# Игнорировать объявления «в резерве».
ignore_reserv = true
# Игнорировать продвинутые (платно поднятые) объявления.
ignore_promotion = false

# --- Прокси (мобильный, рекомендуется) -----------------------------------
# Формат: login:password@ip:port  (без http://)
proxy_string = ""
# Ссылка смены IP у мобильного прокси (вызывается при бане). Опционально.
proxy_change_url = ""
# Прокси для отправки уведомлений (если Telegram заблокирован в вашей сети).
proxy_notifier = ""

# --- Тайминги ------------------------------------------------------------
# Пауза между полными циклами парсинга, сек. Задача: каждые 35–50 сек.
pause_general = 40
# Пауза между ссылками внутри одного цикла, сек.
pause_between_links = 5
# Сколько раз повторять запрос при ошибке/блокировке.
max_count_of_retry = 5
retry_delay = 5
timeout = 20
# Сколько подряд блокировок до смены IP / реакции анти-бана.
block_threshold = 3

# --- Прочее --------------------------------------------------------------
one_time_start = false   # true = один прогон и выход (для отладки)
save_xlsx = true         # сохранять найденное в Excel (папка result/)
one_file_for_link = false
parse_views = false
parse_phone = false

# --- Обход блокировок через сторонний сервис cookies (опционально) -------
# См. docs/ANTIBLOCK.md у Duff89/parser_avito (например spfa.ru).
use_bypass_api = false
cookies_api_key = ""
use_own_cookies = false
use_webdriver = false
